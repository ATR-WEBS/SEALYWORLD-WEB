<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"
     role="img" aria-label="Cofre repleto de zafiros">
  <title>1000 zafiros</title>
  <!--
    Mismo orden que en la bolsa: tapa al fondo, hueco oscuro, gemas y por
    ultimo el frontal. El frontal es el que recorta las gemas por abajo y
    las mete dentro del cofre.
  -->
  <defs>
    <linearGradient id="c-tapa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c88f4c"/>
      <stop offset="1" stop-color="#8a5629"/>
    </linearGradient>
    <linearGradient id="c-cuerpo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ad7439"/>
      <stop offset=".55" stop-color="#8a5629"/>
      <stop offset="1" stop-color="#5e3616"/>
    </linearGradient>
    <linearGradient id="c-oro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset=".5" stop-color="#eeb43c"/>
      <stop offset="1" stop-color="#b9821f"/>
    </linearGradient>
    <linearGradient id="c-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fe4ff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#7fe4ff" stop-opacity="0"/>
    </linearGradient>

    <g id="gema">
      <path d="M0 -15 L12 -8 L12 7 L0 16 L-12 7 L-12 -8 Z"
            fill="#1b7fe0" stroke="#0a4b9e" stroke-width="2.6" stroke-linejoin="round"/>
      <path d="M0 -15 L12 -8 L0 -1 L-12 -8 Z" fill="#8fe4ff"/>
      <path d="M12 -8 L0 -1 L0 16 L12 7 Z" fill="#0f60cf"/>
      <path d="M-8 -7 L-3 -10 L-1 -6 L-6 -3 Z" fill="#ffffff" opacity=".75"/>
    </g>
  </defs>

  <ellipse cx="100" cy="180" rx="70" ry="12" fill="#04324a" opacity=".25"/>
  <ellipse cx="100" cy="88" rx="74" ry="54" fill="url(#c-glow)"/>

  <!-- TAPA
       Abatida hacia atras: se ve mas estrecha que el cuerpo (escorzo) y
       ligeramente girada. Esa asimetria es lo que la saca del plano. -->
  <g transform="rotate(-3 100 84)">
    <path d="M46 86 L44 56 Q100 26 156 56 L154 86 Z"
          fill="url(#c-tapa)" stroke="#5e3616" stroke-width="4" stroke-linejoin="round"/>
    <path d="M52 62 Q100 38 148 62 Q100 48 52 62 Z" fill="#dda765" opacity=".5"/>
    <path d="M45 74 Q100 46 155 74 L155 82 Q100 56 45 82 Z" fill="url(#c-oro)" opacity=".9"/>
    <rect x="90" y="62" width="20" height="26" rx="2" fill="url(#c-oro)" stroke="#8a6210" stroke-width="2"/>
  </g>

  <!-- Hueco -->
  <path d="M44 96 L156 96 L152 118 L48 118 Z" fill="#2c1709"/>
  <path d="M44 96 L156 96 L155 103 L45 103 Z" fill="#160b04"/>

  <!-- Las gemas desbordando -->
  <g transform="translate(62 96) rotate(-22) scale(.88)"><use href="#gema"/></g>
  <g transform="translate(138 94) rotate(20) scale(.9)"><use href="#gema"/></g>
  <g transform="translate(84 82) rotate(-8)"><use href="#gema"/></g>
  <g transform="translate(116 80) rotate(9) scale(.94)"><use href="#gema"/></g>
  <g transform="translate(100 100) scale(1.1)"><use href="#gema"/></g>

  <!-- CUERPO. Va el ultimo: es el que tapa la mitad inferior de las
       gemas y las mete dentro del cofre. -->
  <path d="M36 110 L164 110 L157 172 Q100 183 43 172 Z"
        fill="url(#c-cuerpo)" stroke="#5e3616" stroke-width="4" stroke-linejoin="round"/>

  <!-- Duelas -->
  <g fill="none" stroke="#5e3616" stroke-width="2.5" opacity=".45">
    <path d="M62 112 L60 176"/>
    <path d="M140 112 L142 176"/>
  </g>

  <!-- Herrajes -->
  <rect x="38" y="128" width="124" height="10" fill="url(#c-oro)" opacity=".92"/>
  <rect x="88" y="110" width="24" height="64" fill="url(#c-oro)"/>
  <circle cx="100" cy="142" r="11" fill="#ffe08a" stroke="#8a6210" stroke-width="3"/>
  <rect x="97" y="140" width="6" height="11" rx="3" fill="#8a6210"/>

  <!-- Destellos -->
  <g fill="#eafcff">
    <path d="M36 62 l3 -8 3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 z" opacity=".9"/>
    <path d="M166 76 l2.4 -6 2.4 6 6 2.4 -6 2.4 -2.4 6 -2.4 -6 -6 -2.4 z" opacity=".7"/>
  </g>
</svg>
