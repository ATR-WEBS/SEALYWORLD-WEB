<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"
     role="img" aria-label="Barril desbordado de zafiros">
  <title>2500 zafiros</title>
  <!--
    El barril va ligeramente girado y con la boca abierta hacia arriba:
    de frente y recto parece una lata. El giro tambien deja sitio para
    que unas gemas caigan fuera, que es lo que separa este paquete del
    cofre: aqui sobran.
  -->
  <defs>
    <linearGradient id="r-duela" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b3d16"/>
      <stop offset=".2" stop-color="#a97038"/>
      <stop offset=".5" stop-color="#c08a4c"/>
      <stop offset=".82" stop-color="#8a5629"/>
      <stop offset="1" stop-color="#5e3616"/>
    </linearGradient>
    <linearGradient id="r-aro" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d7681"/>
      <stop offset=".35" stop-color="#c3cdd6"/>
      <stop offset=".7" stop-color="#8a949e"/>
      <stop offset="1" stop-color="#5a636d"/>
    </linearGradient>
    <linearGradient id="r-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fe4ff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#7fe4ff" stop-opacity="0"/>
    </linearGradient>

    <g id="gema">
      <path d="M0 -15 L12 -8 L12 7 L0 16 L-12 7 L-12 -8 Z"
            fill="#1b7fe0" stroke="#0a4b9e" stroke-width="2.6" stroke-linejoin="round"/>
      <path d="M0 -15 L12 -8 L0 -1 L-12 -8 Z" fill="#8fe4ff"/>
      <path d="M12 -8 L0 -1 L0 16 L12 7 Z" fill="#0f60cf"/>
      <path d="M-8 -7 L-3 -10 L-1 -6 L-6 -3 Z" fill="#ffffff" opacity=".75"/>
    </g>
  </defs>

  <ellipse cx="100" cy="182" rx="68" ry="11" fill="#04324a" opacity=".25"/>
  <ellipse cx="102" cy="84" rx="72" ry="52" fill="url(#r-glow)"/>

  <!-- Gemas sueltas del suelo. Van ANTES del barril para que este las
       recorte: asi parece que han rodado por delante y por detras. -->
  <g transform="translate(40 166) rotate(-24) scale(.8)"><use href="#gema"/></g>

  <!-- EL BARRIL -->
  <g transform="rotate(6 104 130)">

    <!-- Boca -->
    <ellipse cx="104" cy="88" rx="46" ry="16" fill="#3a2110"/>

    <!-- Las gemas de dentro, encajadas en la boca -->
    <g transform="translate(78 82) rotate(-18) scale(.86)"><use href="#gema"/></g>
    <g transform="translate(130 80) rotate(18) scale(.88)"><use href="#gema"/></g>
    <g transform="translate(104 70) scale(1.02)"><use href="#gema"/></g>
    <g transform="translate(104 92) rotate(3) scale(.8)"><use href="#gema"/></g>

    <!-- Duelas. La silueta se ensancha en el centro: un barril no tiene
         lados rectos y es lo primero que se nota si los tiene. -->
    <path d="M58 90 C 44 118, 44 150, 58 172 Q104 184 150 172
             C 164 150, 164 118, 150 90 Q104 102 58 90 Z"
          fill="url(#r-duela)" stroke="#4d2c11" stroke-width="4" stroke-linejoin="round"/>

    <!-- Juntas entre tablas -->
    <g fill="none" stroke="#5e3616" stroke-width="2.5" opacity=".5">
      <path d="M80 96 C 72 124, 72 152, 80 176"/>
      <path d="M104 100 L104 180"/>
      <path d="M128 96 C 136 124, 136 152, 128 176"/>
    </g>

    <!-- Aros de hierro -->
    <path d="M50 108 C 84 118, 124 118, 158 108 L158 120 C 124 130, 84 130, 50 120 Z"
          fill="url(#r-aro)" stroke="#43494f" stroke-width="2"/>
    <path d="M48 146 C 84 156, 124 156, 160 146 L160 158 C 124 168, 84 168, 48 158 Z"
          fill="url(#r-aro)" stroke="#43494f" stroke-width="2"/>

    <!-- Brillo del canto izquierdo -->
    <path d="M62 94 C 50 120, 50 150, 62 170 C 58 148, 58 118, 68 96 Z"
          fill="#e2ac6a" opacity=".45"/>
  </g>

  <!-- Gemas que ya han caido fuera, por delante del barril -->
  <g transform="translate(162 158) rotate(26) scale(.84)"><use href="#gema"/></g>
  <g transform="translate(140 178) rotate(-10) scale(.7)"><use href="#gema"/></g>

  <!-- Destellos -->
  <g fill="#eafcff">
    <path d="M36 58 l3 -8 3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 z" opacity=".85"/>
    <path d="M170 64 l2.6 -7 2.6 7 7 2.6 -7 2.6 -2.6 7 -2.6 -7 -7 -2.6 z" opacity=".7"/>
  </g>
</svg>
