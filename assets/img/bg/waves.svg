<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000"
     preserveAspectRatio="none" role="presentation">
  <title>Olas de fondo</title>
  <!--
    Bandas de luz sobre el agua. Van sobre fondo TRANSPARENTE: el color
    del mar lo pone el degradado de .sea en base.css y estas curvas solo
    lo aclaran por encima. Asi se puede cambiar el azul de la pagina sin
    tener que redibujar este archivo.

    El alto se repite (repeat-y) al cubrir paginas largas, por eso la
    primera y la ultima banda estan a la misma altura relativa: la union
    entre dos copias cae dentro de una curva y no se ve la costura.
  -->
  <g fill="#ffffff">
    <path opacity=".07" d="M0 0 C 380 70 520 -40 900 30 C 1220 90 1400 10 1600 50 L1600 0 Z"/>
    <path opacity=".10" d="M-40 150 C 300 60 560 240 900 160 C 1180 95 1400 200 1640 140 L1640 230 C 1380 300 1160 190 880 250 C 540 325 280 155 -40 245 Z"/>
    <path opacity=".06" d="M-40 380 C 260 300 520 470 860 400 C 1160 340 1420 440 1640 380 L1640 500 C 1400 560 1140 460 840 520 C 500 588 240 430 -40 500 Z"/>
    <path opacity=".09" d="M-40 640 C 240 560 480 720 820 660 C 1140 604 1400 700 1640 640 L1640 740 C 1380 800 1120 710 820 765 C 460 830 220 690 -40 760 Z"/>
    <path opacity=".05" d="M-40 880 C 300 810 540 960 900 900 C 1200 850 1420 930 1640 880 L1640 1000 L-40 1000 Z"/>
  </g>

  <!-- Espuma tenue: dos hilos claros que rompen la limpieza de las
       bandas grandes y evitan que el fondo parezca un degradado liso. -->
  <g fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round">
    <path opacity=".12" d="M-40 205 C 300 120 560 295 900 215 C 1180 150 1400 255 1640 195"/>
    <path opacity=".08" d="M-40 700 C 240 620 480 780 820 720 C 1140 664 1400 760 1640 700"/>
  </g>
</svg>
