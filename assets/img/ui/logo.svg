<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 116" width="300" height="116"
     role="img" aria-label="Sealyworld">
  <title>Sealyworld</title>
  <!--
    Marca provisional: la foca sobre el rotulo, dibujada a la misma
    proporcion que el logo real para poder sustituirla sin tocar el CSS
    (el pie reserva 150x58 y la escala la resuelve este viewBox).
    Cuando tengas el logo definitivo, pisa este archivo: nada mas lo usa.
  -->
  <defs>
    <linearGradient id="l-txt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bfe9f7"/>
    </linearGradient>
    <linearGradient id="l-seal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd6ea"/>
      <stop offset="1" stop-color="#4fa8c9"/>
    </linearGradient>
  </defs>

  <!-- La foca -->
  <g transform="translate(150 34)">
    <ellipse cx="0" cy="4" rx="34" ry="24" fill="url(#l-seal)"/>
    <ellipse cx="0" cy="10" rx="24" ry="14" fill="#d7f2fb"/>
    <!-- Aletas -->
    <path d="M-30 18 q-16 6 -22 -2 q10 -8 22 -6 z" fill="#4fa8c9"/>
    <path d="M30 18 q16 6 22 -2 q-10 -8 -22 -6 z" fill="#4fa8c9"/>
    <!-- Gafas de sol: el guino playero de la marca -->
    <rect x="-24" y="-8" width="48" height="4" rx="2" fill="#0c4256"/>
    <rect x="-24" y="-8" width="20" height="14" rx="5" fill="#0c4256"/>
    <rect x="4" y="-8" width="20" height="14" rx="5" fill="#0c4256"/>
    <rect x="-20" y="-5" width="7" height="5" rx="2" fill="#63c8e8" opacity=".8"/>
    <!-- Hocico -->
    <ellipse cx="0" cy="13" rx="7" ry="5" fill="#ffffff"/>
    <ellipse cx="0" cy="11" rx="3" ry="2.4" fill="#0c4256"/>
    <path d="M-7 16 q7 5 14 0" fill="none" stroke="#0c4256" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- El rotulo -->
  <g font-family="Fredoka, 'Trebuchet MS', sans-serif" font-weight="700" text-anchor="middle">
    <text x="150" y="86" font-size="34" fill="#0a5170" stroke="#0a5170" stroke-width="7"
          stroke-linejoin="round" letter-spacing="1">SEALY</text>
    <text x="150" y="86" font-size="34" fill="url(#l-txt)" letter-spacing="1">SEALY</text>
    <text x="150" y="110" font-size="19" fill="#0a5170" stroke="#0a5170" stroke-width="6"
          stroke-linejoin="round" letter-spacing="6">WORLD</text>
    <text x="150" y="110" font-size="19" fill="#ffd75e" letter-spacing="6">WORLD</text>
  </g>
</svg>
